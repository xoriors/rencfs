name: '_build-and-tests'
on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # TODO: remove this when we cache the builds

jobs:
  tests:
    name: build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: setup Rust
        run: |
          rustup toolchain install nightly-2025-03-01 --profile minimal --component rustfmt,clippy
          rustup show

      - name: packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-aur
          cargo install cargo-generate-rpm          

      - name: Install pinned WinFsp runtime and developer files
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $expected = '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a'
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WinFsp installer checksum mismatch'
          }
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'ADDLOCAL=ALL')
          if ($install.ExitCode -ne 0) { throw "WinFsp install failed/requires reboot: $($install.ExitCode)" }

      - name: build
        run: |
          cargo build --all-targets --all-features
          cargo build --release --all-targets --all-features

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: check
        run: cargo check --all

      - name: clippy
        run: |
          cargo clippy --all-targets --release -- \
            -A clippy::similar_names \
            -A clippy::too_many_arguments \
            -A clippy::significant_drop_tightening \
            -A clippy::redundant_closure \
            -A clippy::missing_errors_doc \
            -A clippy::type_complexity
        shell: bash

      - name: tests
        if: matrix.os != 'windows-latest'
        run: cargo test --release --all --all-features -- --skip keyring

      - name: Native Windows callbacks and mounted filesystem
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\test-windows.ps1 -Drive R: -TranscriptPath windows-test.log

      - name: bench
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --workspace --all-targets --all-features

      - name: doc
        run: cargo doc --workspace --all-features --no-deps

      - name: test package
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo aur
          cargo generate-rpm

      - name: java-bridge build
        run: |
          cd java-bridge
          cargo build --all-targets --all-features
          cargo build --release --all-targets --all-features

      - name: java-bridge Windows DLL loading
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\test-windows-java-bridge.ps1 -DllPath .\java-bridge\target\release\java_bridge.dll

      - name: java-bridge fmt check
        run: |
          cd java-bridge
          cargo fmt --all -- --check

      - name: java-bridge check
        run: |
          cd java-bridge
          cargo check --all

      - name: java-bridge clippy
        run: |
          cd java-bridge
          cargo clippy --all-targets --release -- \
            -A clippy::similar_names \
            -A clippy::too_many_arguments \
            -A clippy::significant_drop_tightening \
            -A clippy::redundant_closure \
            -A clippy::missing_errors_doc \
            -A clippy::type_complexity
        shell: bash

      - name: java-bridge tests
        if: matrix.os != 'windows-latest'
        run: |
          cd java-bridge
          cargo test --release --all --all-features

      - name: bench
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd java-bridge        
          cargo bench --workspace --all-targets --all-features

      - name: java-bridge doc
        run: |
          cd java-bridge
          cargo doc --workspace --all-features --no-deps
