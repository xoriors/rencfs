[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "rencfs"
description = "Python bindings for the rencfs encrypted file system"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
module-name = "rencfs"
